<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>Household · Fast to Eat ⏱️</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="eat-skin.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .link-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.75rem 0; border-top: 1px solid var(--border); }
    .link-row:first-child { border-top: 0; }
    .link-who { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .link-name { font-weight: 600; overflow-wrap: anywhere; }
    .link-row select { flex: 1 1 14rem; max-width: 22rem; min-width: 0; font-size: 16px; }
    /* On a phone every picker sits under its name, whatever the name's length. */
    @media (max-width: 520px) { .link-row select { flex-basis: 100%; max-width: none; } }
    .link-note { flex-basis: 100%; margin: 0; font-size: 0.85rem; }
  </style>
  <script src="theme.js" defer></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>⏱️ Household</h1>
      <button data-theme-toggle class="btn-ghost" type="button">☀️</button>
    </header>

    <section class="card">
      <h2>Who is who</h2>
      <p class="muted">
        Fast to Eat now knows people by their household account in Home Base.
        Match each Fast to Eat member to the person they are. Anyone you leave
        unlinked is asked to find a parent when they open Fast to Eat.
      </p>
      <div id="link-status" class="status">Loading household members…</div>
    </section>

    <section class="card">
      <div id="link-rows"></div>
    </section>

    <section class="card hidden" id="link-done-card">
      <div class="row">
        <div class="grow"></div>
        <a href="." class="btn-primary" id="link-done">Open Fast to Eat</a>
      </div>
    </section>
  </div>

  <script src="link.js" defer></script>
</body>
</html>
