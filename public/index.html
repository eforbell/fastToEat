<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <title>Fast to Eat ⏱️ · Today</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="eat-skin.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js" defer></script>
</head>
<body data-nav-page="today">
  <div id="app">
    <header>
      <h1 id="greeting">⏱️ Fast to Eat</h1>
      <div class="row">
        <span id="streak-badge" class="streak-badge hidden">⭐ <span id="streak-count">0</span>-day streak</span>
        <button data-theme-toggle class="btn-ghost" type="button">☀️</button>
      </div>
    </header>

    <section class="hero">
      <div class="state-label" id="state-label">Loading…</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="target-line" id="target-line"></div>
      <div class="action">
        <button id="action-btn" class="btn-primary hidden" type="button">Start fast</button>
      </div>
      <div id="action-status" class="status"></div>
    </section>

    <section class="card hidden" id="adjust-card">
      <button id="adjust-btn" class="btn-ghost" type="button">✏️ Adjust time</button>
    </section>

    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal">
        <h2>Adjust fast times</h2>
        <label class="field">
          <span>Start</span>
          <div class="adjust-row">
            <button class="adj-btn" data-field="edit-start" data-delta="-30">-30m</button>
            <button class="adj-btn" data-field="edit-start" data-delta="-15">-15m</button>
            <button class="adj-btn" data-field="edit-start" data-delta="-5">-5m</button>
            <input type="datetime-local" id="edit-start" step="60">
            <button class="adj-btn" data-field="edit-start" data-delta="5">+5m</button>
            <button class="adj-btn" data-field="edit-start" data-delta="15">+15m</button>
            <button class="adj-btn" data-field="edit-start" data-delta="30">+30m</button>
          </div>
        </label>
        <label class="field">
          <span>End</span>
          <div class="adjust-row">
            <button class="adj-btn" data-field="edit-end" data-delta="-30">-30m</button>
            <button class="adj-btn" data-field="edit-end" data-delta="-15">-15m</button>
            <button class="adj-btn" data-field="edit-end" data-delta="-5">-5m</button>
            <input type="datetime-local" id="edit-end" step="60">
            <button class="adj-btn" data-field="edit-end" data-delta="5">+5m</button>
            <button class="adj-btn" data-field="edit-end" data-delta="15">+15m</button>
            <button class="adj-btn" data-field="edit-end" data-delta="30">+30m</button>
          </div>
        </label>
        <div id="edit-status" class="status"></div>
        <div class="row" style="margin-top:1rem">
          <button id="edit-save" class="btn-primary" type="button">Save</button>
          <button id="edit-cancel" class="btn-ghost" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <section class="card" id="break-meal-card">
      <h2>Break-meal note (optional)</h2>
      <label class="field">
        <textarea id="break-meal-note" rows="2" placeholder="e.g. eggs + avocado, berries"></textarea>
      </label>
      <p class="muted" style="font-size:0.85rem">Saved with the fast when you end it.</p>
    </section>

    <section class="card" id="board">
      <h2>Family board</h2>
      <div id="leaderboard"></div>
    </section>

    <section class="card">
      <div class="row">
        <a href="calendar" class="btn">⭐ Calendar</a>
        <a href="settings" class="btn">⚙️ Settings</a>
        <div class="grow"></div>
        <button id="switch-user" class="btn-ghost" type="button">Switch user</button>
      </div>
    </section>
  </div>

  <script src="nav.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
